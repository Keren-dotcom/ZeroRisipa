services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: the API in a container with Python 3.12 (see Dockerfile).
  # `docker compose up -d db` still starts only the database.
  api:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database is the `db` service on its internal port,
      # whatever POSTGRES_HOST / POSTGRES_PORT say in .env for local runs.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount the code so changes are picked up without rebuilding the image.
      - ./:/app
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
