# Render Blueprint: deploys the API and the frontend on Render's free plan.
# The database lives on Neon (free, does not expire). See docs/DEPLOY.md.
services:
  - type: web
    name: zerorisipa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The free plan has no pre-deploy step, so migrations and the (idempotent) seed run on start.
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        sync: false # paste the Neon connection string
      - key: CORS_ORIGINS
        sync: false # the frontend URL, e.g. https://zerorisipa.onrender.com
      - key: JWT_SECRET_KEY
        generateValue: true

  - type: web
    name: zerorisipa
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # React Router uses browser URLs, so every path must serve index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_BASE_URL
        sync: false # the API URL, e.g. https://zerorisipa-api.onrender.com
