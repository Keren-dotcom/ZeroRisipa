# Render Blueprint: deploys the API on Render's free plan.
# The frontend is on Vercel and the database on Neon (both free). See docs/DEPLOY.md.
services:
  - type: web
    name: zerorisipa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The free plan has no pre-deploy step, so migrations and the (idempotent) seed run on start.
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        sync: false # paste the Neon connection string
      - key: CORS_ORIGINS
        sync: false # the frontend URL, e.g. https://zerorisipa.vercel.app
      - key: JWT_SECRET_KEY
        generateValue: true

